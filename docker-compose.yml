services:
  libraryapi:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7700:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__LibraryDbContext=Server=sqlserverservice;Database=LibraryDb;User Id=sa;Password=BigPassw0rd1;TrustServerCertificate=True
    depends_on:
      sqlserverservice:
        condition: service_healthy

  sqlserverservice:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=BigPassw0rd1
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P BigPassw0rd1 -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  mssql_data: